# Guard file: it changes only with Hugo's review.
# ORFO's minimal CI, written once in OrfoBe/orfo (docs/conventions.md): gitleaks, AGENTS.md's cap,
# no archive folder, links and workflows. The repository holds pictures: no lint, no tests.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: OrfoBe/orfo/.github/workflows/minimal-ci.yml@main
